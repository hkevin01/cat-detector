name: Package Validate

on:
  push:
  pull_request:

jobs:
  package-linux:
    name: Linux Editable + Wheel Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/dev-linux.txt build twine

      - name: Validate editable install
        run: pip install -c constraints/dev-linux.txt -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate artifacts
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert wheels, "No wheel artifact produced"
          assert sdists, "No sdist artifact produced"

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              assert any(n.endswith("METADATA") for n in names), "Wheel missing METADATA"
              assert any(n.endswith("entry_points.txt") for n in names), "Wheel missing entry points"
          print("Linux packaging artifacts validated")
          PY

  package-windows:
    name: Windows Editable + Wheel Validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/dev-windows.txt build twine

      - name: Validate editable install
        run: pip install -c constraints/dev-windows.txt -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate artifacts
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert wheels, "No wheel artifact produced"
          assert sdists, "No sdist artifact produced"

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              assert any(n.endswith("METADATA") for n in names), "Wheel missing METADATA"
              assert any(n.endswith("entry_points.txt") for n in names), "Wheel missing entry points"
          print("Windows packaging artifacts validated")
          PY
