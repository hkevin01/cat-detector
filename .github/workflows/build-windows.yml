# =============================================================================
# ID:       CAT-DETECTOR-CI-WINDOWS-001
# Purpose:  Build the Windows standalone exe and GUI installer on every push to
#           main, on version tags, and on manual dispatch.
#           On version tags, artifacts are attached to a GitHub Release.
# Runner:   windows-latest (Windows Server 2022)
#           — Python 3.12, InnoSetup 6.7.1, pip all preinstalled.
# Outputs:
#   Artifact "cat-detector-windows-exe":       dist/cat-detector.exe
#   Artifact "cat-detector-windows-installer": dist/cat-detector-installer-*.exe
# =============================================================================

name: Build Windows Application

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-windows:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest

    permissions:
      contents: write   # required by softprops/action-gh-release to create releases

    steps:
      # -----------------------------------------------------------------------
      # 1. Source checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Install Python build dependencies
      #    (Python 3.12 is already on the runner PATH as the default python)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install pyinstaller pynput winotify

      # -----------------------------------------------------------------------
      # 3. Build standalone exe with PyInstaller
      #    Reads:  cat_detector.spec
      #    Writes: dist/cat-detector.exe
      # -----------------------------------------------------------------------
      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean cat_detector.spec

      # -----------------------------------------------------------------------
      # 4. Build GUI installer with Inno Setup 6
      #    Inno Setup is preinstalled at the path below on windows-latest.
      #    Reads:  installer/cat-detector.iss  (references dist/cat-detector.exe)
      #    Writes: dist/cat-detector-installer-2.0.0-windows-x64.exe
      # -----------------------------------------------------------------------
      - name: Build installer (Inno Setup)
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          installer\cat-detector.iss

      # -----------------------------------------------------------------------
      # 5. Upload artifacts for every build (available for 30 days)
      # -----------------------------------------------------------------------
      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: cat-detector-windows-exe
          path: dist\cat-detector.exe
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cat-detector-windows-installer
          path: dist\cat-detector-installer-*-windows-x64.exe
          retention-days: 30

      # -----------------------------------------------------------------------
      # 6. Create a GitHub Release and attach both artifacts
      #    Only runs on version tags (e.g. v2.0.0)
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist\cat-detector.exe
            dist\cat-detector-installer-*-windows-x64.exe
