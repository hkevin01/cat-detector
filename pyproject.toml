[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-detector"
version = "2.0.0"
description = "Detects when a cat or toddler walks on your keyboard and responds appropriately"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "kevin" }]
keywords = ["cat", "keyboard", "evdev", "linux", "windows", "wayland", "kde", "toddler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
# No hard dependencies — each platform pulls only what it needs
dependencies = []

[project.scripts]
cat-detector = "cat_detector:main"
cat-detector-open-status = "cat_detector:open_status_page_main"
cat-detector-open-heartbeat = "cat_detector:open_raw_heartbeat_main"
cat-detector-status-tray = "cat_status_tray:main"

[project.optional-dependencies]
linux   = ["evdev>=1.6"]
windows = ["pynput>=1.7", "winotify>=1.1", "pystray>=0.19", "Pillow>=10.0"]
dev     = ["pytest", "ruff", "hypothesis>=6.0", "build>=1.2"]

[tool.ruff]
line-length = 100

[tool.setuptools]
py-modules = ["cat_detector", "cat_status_tray"]
